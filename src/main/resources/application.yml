spring:
  port: 8080
  config:
    import:
      - application-s3.yml
      - application-openapi.yml
      - application-database.yml
      - application-ocr.yml
      - application-security.yml
      - application-openai.yml
      - application-client.yml
  cache:
    type: simple
  thymeleaf:
    cache: false

  web:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true  # ✅ 올바른 설정

server:
  port: 8080
  http2:
    enabled: true
  error:
    include-exception: true
    include-stacktrace: always